<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MWGC Ringerboard 2026</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js"></script>
<style>
:root { --bg:#dff5df; --panel:rgba(233,248,233,.96); --line:rgba(34,94,34,.12); --text:#173217; --muted:#4b6b4b; }
* { box-sizing:border-box; }
body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:radial-gradient(circle at top,#9fd69f 0%,#cdeccd 45%,#edf9ed 100%); color:var(--text); }
.wrap { max-width:1600px; margin:0 auto; padding:24px; }
.hero { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:18px; }
.title h1 { margin:0; font-size:30px; letter-spacing:-.03em; }
.title p { margin:8px 0 0; color:var(--muted); }
.pills { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.pill { border:1px solid var(--line); background:rgba(255,255,255,.45); border-radius:999px; padding:7px 12px; font-size:13px; color:var(--text); }
.hero .title { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.hero .title h1 { margin:0; }
.upload { min-width:320px; border:1px solid var(--line); border-radius:18px; padding:14px; background:rgba(255,255,255,.45); }
.upload label { display:block; font-size:13px; margin-bottom:8px; color:var(--muted); }
.tabs { display:flex; gap:10px; margin:18px 0; flex-wrap:wrap; }
.tabbtn { border:1px solid var(--line); background:rgba(255,255,255,.45); color:var(--text); padding:12px 16px; border-radius:14px; font-weight:700; cursor:pointer; }
.tabbtn.active { background:linear-gradient(135deg,rgba(34,197,94,.18),rgba(56,189,248,.18)); }
.panel { display:none; border:1px solid var(--line); border-radius:24px; padding:18px; background:var(--panel); box-shadow:0 14px 35px rgba(0,0,0,.15); }
.panel.active { display:block; }
.controls { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; margin-bottom:14px; }
.controls .left, .controls .right { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.input, select { min-width:220px; border:1px solid var(--line); background:rgba(255,255,255,.82); color:var(--text); border-radius:12px; padding:10px 12px; }
.stats { display:grid; gap:12px; margin-bottom:16px; grid-template-columns:repeat(5,minmax(0,1fr)); }
.card { border:1px solid var(--line); border-radius:18px; padding:16px; background:rgba(255,255,255,.55); }
.label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
.value { font-size:28px; font-weight:800; margin-top:10px; }
.tablewrap { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.6); }
table { width:100%; min-width:1300px; border-collapse:collapse; }
thead th { position:sticky; top:0; z-index:2; background:#b7ddb7; border-bottom:1px solid var(--line); padding:11px 10px; white-space:nowrap; font-size:13px; }
tbody th, tbody td { border-bottom:1px solid rgba(255,255,255,.45); padding:8px 10px; white-space:nowrap; font-size:13px; text-align:center; }
tbody th { position:sticky; left:0; z-index:1; text-align:left; background:linear-gradient(90deg, rgba(183,221,183,.98), rgba(210,238,210,.9)); cursor:pointer; }
tbody tr:hover { background:rgba(255,255,255,.35); }
.namecell { display:flex; align-items:center; gap:10px; }
.score { min-width:40px; display:inline-block; border-radius:10px; padding:6px 0; font-weight:700; color:#111; background:transparent; }
.blank { color:#6b7280; background:transparent; font-weight:500; }
.s1, .s2, .s3, .s4, .s5, .s6plus { background:transparent; color:#111; }
.pinkcell { background:#f7c6d0 !important; color:#111; }
.scorecard-wrap { overflow:auto; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.6); }
.scorecard { width:100%; border-collapse:collapse; min-width:1320px; }
.scorecard th, .scorecard td { border-bottom:1px solid rgba(255,255,255,.45); padding:8px 10px; text-align:center; white-space:nowrap; }
.scorecard thead th { position:sticky; top:0; background:#b7ddb7; z-index:1; }
.scorecard th.corner, .scorecard th.rowlabel { position:sticky; left:0; background:linear-gradient(90deg, rgba(183,221,183,.98), rgba(210,238,210,.9)); text-align:left; z-index:2; }
.scorecard td.totalcol, .scorecard th.totalhead { font-weight:800; background:rgba(183,221,183,.34); }
.scorecard td.holeheader { background:rgba(183,221,183,.22); font-weight:700; }
.grid { display:grid; grid-template-columns:1.1fr .9fr; gap:14px; margin-top:14px; }
.block { border:1px solid var(--line); border-radius:18px; padding:16px; background:rgba(255,255,255,.55); }
.block h2 { margin:0; font-size:18px; }
.blockhead { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; }
.mini { color:var(--muted); font-size:13px; }
.holes { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.hole { border:1px solid var(--line); border-radius:16px; padding:10px; background:rgba(3,7,18,.04); }
.hole .h { color:#2f6f2f; font-weight:700; margin-bottom:6px; }
.hole .v { font-size:20px; font-weight:800; }
.foot { color:var(--muted); font-size:12px; margin-top:14px; line-height:1.5; }
@media (max-width:1200px) { .hero { flex-direction:column; } .grid { grid-template-columns:1fr; } .stats { grid-template-columns:1fr 1fr; } }
@media (max-width:720px) { .stats, .holes { grid-template-columns:1fr; } .input,select { min-width:100%; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="title">
      <div class="pills" id="pills"></div>
      <h1>MWGC Ringerboard 2026</h1>
    </div>
  </div>

  <div class="tabs">
    <button class="tabbtn active" data-tab="boardTab">Full Ringer Board</button>
    <button class="tabbtn" data-tab="profileTab">Player Profile</button>
  </div>

  <section id="boardTab" class="panel active">
    <div class="controls">
      <div class="left">
        <input class="input" id="boardSearch" placeholder="Search players..." />
        <select id="boardSort">
          <option value="ringer_asc">Sort: Ringer total (low to high)</option>
          <option value="ringer_desc">Sort: Ringer total (high to low)</option>
          <option value="name_asc">Sort: Player name (A-Z)</option>
        </select>
      </div>
      <div class="right mini" id="boardSubtitle"></div>
    </div>
    <div class="tablewrap"><table id="boardTable"></table></div>
  </section>

  <section id="profileTab" class="panel">
    <div class="controls">
      <div class="left" style="flex-direction:column; align-items:flex-start; gap:6px;">
        <input class="input" id="playerSearch" placeholder="Type a player name..." list="playerOptions" />
        <div class="mini" id="playerHint">Type a player name to view their scorecard.</div>
        <datalist id="playerOptions"></datalist>
      </div>
    </div>
    <div class="stats" id="profileKpis"></div>
    <div class="block">
      <div class="blockhead">
        <h2>Player Scorecard</h2>
        <div class="mini" id="profileSubtitle">Workbook-style layout by hole</div>
      </div>
      <div class="scorecard-wrap" id="profileScorecard"></div>
    </div>
  </section>

  <div class="foot" id="footer"></div>
  <div class="upload" style="margin-top:18px;">
    <label>Refresh by uploading a new workbook (.xlsx)</label>
    <input id="masterFile" type="file" accept=".xlsx" />
    <div class="mini" style="margin-top:10px;">Primary source: <strong>data.json</strong>. Uploading a workbook is available as a backup refresh path.</div>
  </div>
</div>
<script>
const DEFAULT_PARS = [4,3,4,4,3,4,5,5,4,4,5,4,4,4,4,3,4,3];
const EMPTY_STATE = {
  meta: {
    source_master_file: 'No workbook loaded',
    dashboard_file: 'No workbook loaded',
    board_sheet: '2026 Ringer Board',
    profile_sheet: 'Player Profile',
    last_updated: '—',
  },
  ringerBoard: { sheet_name: '2026 Ringer Board', par_by_hole: DEFAULT_PARS.slice(), total_par: 71, last_updated: '—', player_count: 0, players: [] },
  playerProfile: { sheet_name: 'Player Profile', last_updated: '—', title: 'Player Profile', type_name_label: 'Type Name:', default_player: '', note: '', summary: {ringer_total: 0, eagles_total: 0, birdies_total: 0, chip_ins_total: 0, sand_saves_total: 0}, par_by_hole: DEFAULT_PARS.slice(), total_par: 71, hole_numbers: Array.from({length:18}, (_, i) => i + 1), scorecard_rows: [] },
};
let state = JSON.parse(JSON.stringify(EMPTY_STATE));
let currentPlayer = '';

const fmt = v => (v === null || v === undefined || v === '') ? '—' : v;
const num = v => {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
};
const scoreClass = s => {
  if (s === null || s === undefined || s === '') return 'blank';
  const n = Number(s);
  if (!Number.isFinite(n)) return 'blank';
  if (n <= 1) return 's1';
  if (n === 2) return 's2';
  if (n === 3) return 's3';
  if (n === 4) return 's4';
  if (n === 5) return 's5';
  return 's6plus';
};
const rowToTotals = (p) => ({
  ringer_total: num(p.ringer_total),
  eagles_total: num(p.eagles_total),
  birdies_total: num(p.birdies_total),
  chip_ins_total: num(p.chip_ins_total),
  sand_saves_total: num(p.sand_saves_total),
});

function setStatus(text) { document.getElementById('footer').textContent = text; }
function setTab(id) { document.querySelectorAll('.panel').forEach(p => p.classList.remove('active')); document.querySelectorAll('.tabbtn').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelector('.tabbtn[data-tab="' + id + '"]').classList.add('active'); }
function getBoardPlayer(name) { return (state.ringerBoard.players || []).find(p => p.player_name === name) || null; }
function updateHint() {
  const note = state.playerProfile.note ? `${state.playerProfile.note}` : 'Type a player name to view their scorecard.';
  document.getElementById('playerHint').textContent = note;
}

function normalizePlayer(p, idx) {
  const holes = Array.isArray(p.holes) ? p.holes.map((h, hIdx) => ({
    hole: num(h.hole) || (hIdx + 1),
    score: (h.score === null || h.score === undefined || h.score === '') ? null : num(h.score),
    birdie: num(h.birdie),
    eagle: num(h.eagle),
    chip_in: num(h.chip_in),
    sand_save: num(h.sand_save),
  })) : Array.from({ length: 18 }, (_, hIdx) => ({ hole: hIdx + 1, score: null, birdie: 0, eagle: 0, chip_in: 0, sand_save: 0 }));
  return {
    gc_id: p.gc_id || '',
    first_name: p.first_name || '',
    last_name: p.last_name || '',
    player_name: p.player_name || `${p.first_name || ''} ${p.last_name || ''}`.trim(),
    holes,
    ringer_total: num(p.ringer_total),
    birdies_total: num(p.birdies_total),
    eagles_total: num(p.eagles_total),
    chip_ins_total: num(p.chip_ins_total),
    sand_saves_total: num(p.sand_saves_total),
    holes_scored: num(p.holes_scored),
    weeks_count: num(p.weeks_count) || 1,
    _idx: idx,
  };
}

function normalizeData(input) {
  const data = input && typeof input === 'object' ? input : {};
  const meta = data.meta && typeof data.meta === 'object' ? data.meta : {};
  const ringer = data.ringerBoard && typeof data.ringerBoard === 'object' ? data.ringerBoard : {};
  const profile = data.playerProfile && typeof data.playerProfile === 'object' ? data.playerProfile : {};
  const players = Array.isArray(ringer.players) ? ringer.players.map(normalizePlayer) : [];
  const profileRows = Array.isArray(profile.scorecard_rows) ? profile.scorecard_rows.map(r => ({
    label: r.label || '',
    values: Array.isArray(r.values) ? r.values.map(v => (v === null || v === undefined || v === '' ? 0 : num(v))) : Array.from({length:18}, () => 0),
    total: (r.total === null || r.total === undefined || r.total === '') ? 0 : num(r.total),
  })) : [];
  return {
    meta: {
      source_master_file: meta.source_master_file || 'data.json',
      dashboard_file: meta.dashboard_file || 'data.json',
      board_sheet: meta.board_sheet || '2026 Ringer Board',
      profile_sheet: meta.profile_sheet || 'Player Profile',
      last_updated: meta.last_updated || ringer.last_updated || profile.last_updated || '—',
    },
    ringerBoard: {
      sheet_name: ringer.sheet_name || '2026 Ringer Board',
      par_by_hole: Array.isArray(ringer.par_by_hole) && ringer.par_by_hole.length === 18 ? ringer.par_by_hole.map(num) : DEFAULT_PARS.slice(),
      total_par: num(ringer.total_par) || 71,
      last_updated: ringer.last_updated || meta.last_updated || '—',
      player_count: num(ringer.player_count) || players.length,
      players,
    },
    playerProfile: {
      sheet_name: profile.sheet_name || 'Player Profile',
      last_updated: profile.last_updated || meta.last_updated || '—',
      title: profile.title || 'Player Profile',
      type_name_label: profile.type_name_label || 'Type Name:',
      default_player: profile.default_player || '',
      note: profile.note || '',
      summary: {
        ringer_total: num(profile.summary?.ringer_total),
        eagles_total: num(profile.summary?.eagles_total),
        birdies_total: num(profile.summary?.birdies_total),
        chip_ins_total: num(profile.summary?.chip_ins_total),
        sand_saves_total: num(profile.summary?.sand_saves_total),
      },
      par_by_hole: Array.isArray(profile.par_by_hole) && profile.par_by_hole.length === 18 ? profile.par_by_hole.map(num) : DEFAULT_PARS.slice(),
      total_par: num(profile.total_par) || 71,
      hole_numbers: Array.isArray(profile.hole_numbers) && profile.hole_numbers.length === 18 ? profile.hole_numbers.map(num) : Array.from({length:18}, (_, i) => i + 1),
      scorecard_rows: profileRows,
    },
  };
}

function renderPills() {
  const meta = state.meta || {};
  document.getElementById('pills').innerHTML = `
    <span class="pill">Board updated: ${fmt(state.ringerBoard?.last_updated || meta.last_updated)}</span>
    <span class="pill">Profile updated: ${fmt(state.playerProfile?.last_updated || meta.last_updated)}</span>`;
}

function renderBoard() {
  const q = document.getElementById('boardSearch').value.trim().toLowerCase();
  const sort = document.getElementById('boardSort').value;
  let rows = (state.ringerBoard.players || []).filter(p => !q || p.player_name.toLowerCase().includes(q));
  rows = sort === 'ringer_desc' ? [...rows].sort((a,b) => (b.ringer_total - a.ringer_total) || a.player_name.localeCompare(b.player_name))
       : sort === 'name_asc' ? [...rows].sort((a,b) => a.player_name.localeCompare(b.player_name))
       : [...rows].sort((a,b) => (a.ringer_total - b.ringer_total) || a.player_name.localeCompare(b.player_name));
  const cols = ['Player Name', ...Array.from({length:18}, (_,i) => `Hole ${i+1}`), 'Ringer Total', 'Birdies', 'Eagles', 'Chip Ins', 'Sand Saves'];
  let html = '<thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
  if (!rows.length) {
    html += `<tr><td colspan="24" style="padding:18px;text-align:center;color:var(--muted);">Upload a workbook or replace <strong>data.json</strong> to load player scores from the <strong>2026 Ringer Board</strong> tab.</td></tr>`;
  } else {
    for (const p of rows) {
      html += `<tr><th data-player="${p.player_name}"><div class="namecell"><span>${p.player_name}</span></div></th>`;
      for (const h of p.holes) html += `<td><span class="score ${scoreClass(h.score)}">${fmt(h.score)}</span></td>`;
      html += `<td><strong>${fmt(p.ringer_total)}</strong></td><td>${fmt(p.birdies_total)}</td><td>${fmt(p.eagles_total)}</td><td>${fmt(p.chip_ins_total)}</td><td>${fmt(p.sand_saves_total)}</td></tr>`;
    }
  }
  html += '</tbody>';
  document.getElementById('boardTable').innerHTML = html;
  document.getElementById('boardSubtitle').textContent = `Last updated: ${fmt(state.ringerBoard?.last_updated || state.meta?.last_updated)}`;
  document.querySelectorAll('#boardTable th[data-player]').forEach(th => th.addEventListener('click', () => selectPlayer(th.dataset.player)));
}

function renderProfile() {
  const fallbackName = state.playerProfile.default_player || '';
  if (!currentPlayer) currentPlayer = fallbackName;
  const sourcePlayer = getBoardPlayer(currentPlayer);
  const profileRows = state.playerProfile.scorecard_rows || [];
  const showPlayer = sourcePlayer || null;
  const selectedName = sourcePlayer ? sourcePlayer.player_name : (currentPlayer || fallbackName || '');

  const summary = showPlayer ? rowToTotals(showPlayer) : state.playerProfile.summary;
  const stats = [
    ['Ringer Score', summary.ringer_total],
    ['Eagles', summary.eagles_total],
    ['Birdies', summary.birdies_total],
    ['Chip-Ins', summary.chip_ins_total],
    ['Sand Saves', summary.sand_saves_total],
  ];
  document.getElementById('profileKpis').innerHTML = stats.map(([l,v]) => `<div class="card"><div class="label">${l}</div><div class="value">${fmt(v)}</div></div>`).join('');
  document.getElementById('profileSubtitle').textContent = selectedName ? `Showing: ${selectedName} • Last updated: ${fmt(state.playerProfile?.last_updated || state.meta?.last_updated)}` : `Last updated: ${fmt(state.playerProfile?.last_updated || state.meta?.last_updated)}`;
  document.getElementById('playerHint').textContent = state.playerProfile.note || 'Type a player name to view their scorecard.';

  const pars = state.playerProfile.par_by_hole || DEFAULT_PARS;
  const holeNums = state.playerProfile.hole_numbers || Array.from({length:18}, (_, i) => i + 1);
  const renderRows = showPlayer ? [
    { label: 'Ringer Board', values: showPlayer.holes.map(h => h.score), total: showPlayer.ringer_total },
    { label: 'Eagles', values: showPlayer.holes.map(h => h.eagle), total: showPlayer.eagles_total },
    { label: 'Birdies', values: showPlayer.holes.map(h => h.birdie), total: showPlayer.birdies_total },
    { label: 'Chip-ins', values: showPlayer.holes.map(h => h.chip_in), total: showPlayer.chip_ins_total },
    { label: 'Sand Saves', values: showPlayer.holes.map(h => h.sand_save), total: showPlayer.sand_saves_total },
  ] : profileRows;

  let table = '<table class="scorecard"><thead><tr><th class="corner">Hole</th>';
  table += holeNums.map(n => `<th>${n}</th>`).join('') + '<th class="totalhead">Total</th></tr></thead><tbody>';
  table += `<tr><th class="rowlabel">Par</th>${pars.map(v => `<td class="holeheader">${fmt(v)}</td>`).join('')}<td class="totalcol">${fmt(state.playerProfile.total_par)}</td></tr>`;
  for (const row of renderRows) {
    table += `<tr><th class="rowlabel">${row.label}</th>${row.values.map(v => `<td>${(Number(v) > 0) ? `<span class="pinkcell">${fmt(v)}</span>` : fmt(v)}</td>`).join('')}<td class="totalcol">${fmt(row.total)}</td></tr>`;
  }
  table += '</tbody></table>';
  document.getElementById('profileScorecard').innerHTML = table;
}

function selectPlayer(name) {
  currentPlayer = name || '';
  document.getElementById('playerSearch').value = name || '';
  renderProfile();
}

function renderSelectors() {
  const names = (state.ringerBoard.players || []).map(p => p.player_name);
  document.getElementById('playerOptions').innerHTML = names.map(n => `<option value="${n}"></option>`).join('');
  const desired = currentPlayer || state.playerProfile.default_player || names[0] || '';
  currentPlayer = desired;
  document.getElementById('playerSearch').value = desired;
}

function renderAll() {
  renderPills();
  renderSelectors();
  renderBoard();
  renderProfile();
  setStatus(`Loaded ${state.meta.dashboard_file || 'data.json'}. Board updated ${fmt(state.ringerBoard?.last_updated)}; profile updated ${fmt(state.playerProfile?.last_updated)}.`);
}

function toIsoDate(value) {
  if (value instanceof Date) return value.toISOString().slice(0, 10);
  if (typeof value === 'number' && Number.isFinite(value)) {
    const dt = new Date(Date.UTC(1899, 11, 30) + value * 86400000);
    return dt.toISOString().slice(0, 10);
  }
  if (typeof value === 'string' && value.trim()) return value.trim();
  return '—';
}

async function loadJsonData() {
  try {
    const res = await fetch('./data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    state = normalizeData(json);
    currentPlayer = state.playerProfile.default_player || '';
    renderAll();
  } catch (err) {
    console.warn('Could not load data.json:', err);
    state = JSON.parse(JSON.stringify(EMPTY_STATE));
    currentPlayer = '';
    renderAll();
    setStatus('No data.json found yet. Upload a workbook to load the latest scores.');
  }
}

function parseWorkbook(buffer, fileName) {
  const wb = XLSX.read(buffer, { type:'array', cellDates:true });
  const boardSheet = wb.Sheets['2026 Ringer Board'] || wb.Sheets[(wb.SheetNames || []).find(n => /2026 ringer board/i.test(n))];
  const profileSheet = wb.Sheets['Player Profile'] || wb.Sheets[(wb.SheetNames || []).find(n => /player profile/i.test(n))];
  if (!boardSheet) throw new Error('Could not find the "2026 Ringer Board" tab.');
  if (!profileSheet) throw new Error('Could not find the "Player Profile" tab.');

  const boardRows = XLSX.utils.sheet_to_json(boardSheet, { defval:null, raw:true });
  const boardHeaderRows = XLSX.utils.sheet_to_json(boardSheet, { header:1, defval:null, raw:true });
  const boardTop = boardHeaderRows[0] || [];
  const boardLastUpdated = toIsoDate(boardTop[26]);
  const boardPlayers = boardRows.map(row => {
    const name = String(row['Player Name'] || row['Player name'] || row['PLAYER NAME'] || '').trim();
    if (!name) return null;
    const holes = Array.from({length:18}, (_, i) => {
      const raw = row[`Hole ${i+1}`];
      const score = raw === null || raw === undefined || raw === '' ? null : Number(raw);
      return { hole: i+1, score: Number.isFinite(score) ? score : null, birdie: 0, eagle: 0, chip_in: 0, sand_save: 0 };
    });
    const toNum = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
    return {
      gc_id: '',
      first_name: name.split(/\s+/)[0] || '',
      last_name: name.split(/\s+/).slice(1).join(' ') || '',
      player_name: name,
      holes,
      ringer_total: toNum(row['Ringer Total']),
      birdies_total: toNum(row['Birdies Total']),
      eagles_total: toNum(row['Eagles Total']),
      chip_ins_total: toNum(row['Chip Ins']),
      sand_saves_total: toNum(row['Sand Saves']),
      holes_scored: holes.filter(h => h.score !== null).length,
      weeks_count: 1,
    };
  }).filter(Boolean);

  const profileRows = XLSX.utils.sheet_to_json(profileSheet, { header:1, defval:null, raw:true });
  const profileLastUpdated = toIsoDate(profileRows[0]?.[2] || boardLastUpdated);
  const defaultPlayer = String(profileRows[3]?.[2] || '').trim();
  const note = String(profileRows[4]?.[1] || '').trim();
  const summary = {
    ringer_total: num(profileRows[2]?.[5]),
    eagles_total: num(profileRows[2]?.[8]),
    birdies_total: num(profileRows[2]?.[11]),
    chip_ins_total: num(profileRows[2]?.[14]),
    sand_saves_total: num(profileRows[2]?.[17]),
  };
  const parByHole = Array.from({length:18}, (_, i) => num(profileRows[6]?.[3+i]) || DEFAULT_PARS[i]);
  const rowsInfo = [
    ['Ringer Board', 7],
    ['Eagles', 8],
    ['Birdies', 9],
    ['Chip-ins', 10],
    ['Sand Saves', 11],
  ];
  const scorecardRows = rowsInfo.map(([label, idx]) => {
    const row = profileRows[idx] || [];
    const values = Array.from({length:18}, (_, i) => num(row[3+i]));
    const total = row[20] === null || row[20] === undefined ? values.reduce((a,b)=>a + b, 0) : num(row[20]);
    return { label, values, total };
  });

  return normalizeData({
    meta: {
      source_master_file: fileName,
      dashboard_file: fileName,
      last_updated: boardLastUpdated,
      board_sheet: '2026 Ringer Board',
      profile_sheet: 'Player Profile',
    },
    ringerBoard: {
      sheet_name: '2026 Ringer Board',
      par_by_hole: DEFAULT_PARS.slice(),
      total_par: 71,
      last_updated: boardLastUpdated,
      player_count: boardPlayers.length,
      players: boardPlayers,
    },
    playerProfile: {
      sheet_name: 'Player Profile',
      last_updated: profileLastUpdated,
      title: 'Player Profile',
      type_name_label: 'Type Name:',
      default_player: defaultPlayer,
      note,
      summary,
      par_by_hole: parByHole,
      total_par: parByHole.reduce((a,b)=>a + (Number(b) || 0), 0),
      hole_numbers: Array.from({length:18}, (_, i) => i + 1),
      scorecard_rows: scorecardRows,
    },
  });
}

async function loadWorkbook(file) {
  try {
    const buffer = await file.arrayBuffer();
    state = parseWorkbook(buffer, file.name);
    currentPlayer = state.playerProfile.default_player || '';
    renderAll();
  } catch (err) {
    console.error(err);
    setStatus(`Could not load workbook: ${err.message || err}`);
    state = JSON.parse(JSON.stringify(EMPTY_STATE));
    currentPlayer = '';
    renderAll();
  }
}

document.querySelectorAll('.tabbtn').forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));
document.getElementById('boardSearch').addEventListener('input', renderBoard);
document.getElementById('boardSort').addEventListener('change', renderBoard);
document.getElementById('playerSearch').addEventListener('change', e => selectPlayer(e.target.value));
document.getElementById('playerSearch').addEventListener('input', e => { if ((state.ringerBoard.players || []).some(p => p.player_name === e.target.value)) selectPlayer(e.target.value); });
document.getElementById('masterFile').addEventListener('change', e => { if (e.target.files[0]) loadWorkbook(e.target.files[0]); });
loadJsonData();
</script>
