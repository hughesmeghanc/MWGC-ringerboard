<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MWGC Ringer Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js"></script>
<style>
:root { --bg:#dff5df; --panel:rgba(233,248,233,.96); --line:rgba(34,94,34,.12); --text:#173217; --muted:#4b6b4b; }
* { box-sizing:border-box; }
body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:radial-gradient(circle at top,#9fd69f 0%,#cdeccd 45%,#edf9ed 100%); color:var(--text); }
.wrap { max-width:1600px; margin:0 auto; padding:24px; }
.hero { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:18px; }
.title h1 { margin:0; font-size:30px; letter-spacing:-.03em; }
.title p { margin:8px 0 0; color:var(--muted); }
.pills { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.pill { border:1px solid var(--line); background:rgba(255,255,255,.45); border-radius:999px; padding:7px 12px; font-size:13px; color:var(--text); }
.upload { min-width:320px; border:1px solid var(--line); border-radius:18px; padding:14px; background:rgba(255,255,255,.45); }
.upload label { display:block; font-size:13px; margin-bottom:8px; color:var(--muted); }
.tabs { display:flex; gap:10px; margin:18px 0; flex-wrap:wrap; }
.tabbtn { border:1px solid var(--line); background:rgba(255,255,255,.45); color:var(--text); padding:12px 16px; border-radius:14px; font-weight:700; cursor:pointer; }
.tabbtn.active { background:linear-gradient(135deg,rgba(34,197,94,.18),rgba(56,189,248,.18)); }
.panel { display:none; border:1px solid var(--line); border-radius:24px; padding:18px; background:var(--panel); box-shadow:0 14px 35px rgba(0,0,0,.15); }
.panel.active { display:block; }
.controls { display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; margin-bottom:14px; }
.controls .left, .controls .right { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.input, select { min-width:220px; border:1px solid var(--line); background:rgba(255,255,255,.82); color:var(--text); border-radius:12px; padding:10px 12px; }
.kpis, .stats { display:grid; gap:12px; margin-bottom:16px; }
.kpis { grid-template-columns:repeat(5,minmax(0,1fr)); }
.stats { grid-template-columns:repeat(5,minmax(0,1fr)); }
.card { border:1px solid var(--line); border-radius:18px; padding:16px; background:rgba(255,255,255,.55); }
.label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
.value { font-size:28px; font-weight:800; margin-top:10px; }
.tablewrap { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.6); }
table { width:100%; min-width:1300px; border-collapse:collapse; }
thead th { position:sticky; top:0; z-index:2; background:#b7ddb7; border-bottom:1px solid var(--line); padding:11px 10px; white-space:nowrap; font-size:13px; }
tbody th, tbody td { border-bottom:1px solid rgba(255,255,255,.45); padding:8px 10px; white-space:nowrap; font-size:13px; text-align:center; }
tbody th { position:sticky; left:0; z-index:1; text-align:left; background:linear-gradient(90deg, rgba(183,221,183,.98), rgba(210,238,210,.9)); cursor:pointer; }
tbody tr:hover { background:rgba(255,255,255,.35); }
.namecell { display:flex; align-items:center; gap:10px; }
.score { min-width:40px; display:inline-block; border-radius:10px; padding:6px 0; font-weight:700; }
.blank { color:#6b7280; background:rgba(255,255,255,.55); font-weight:500; }
.s1 { background:rgba(34,197,94,.28); color:#14532d; } .s2 { background:rgba(34,197,94,.18); color:#166534; } .s3 { background:rgba(250,204,21,.18); color:#854d0e; } .s4 { background:rgba(251,146,60,.18); color:#9a3412; } .s5 { background:rgba(239,68,68,.18); color:#991b1b; } .s6plus { background:rgba(239,68,68,.32); color:#7f1d1d; }
.grid { display:grid; grid-template-columns:1.1fr .9fr; gap:14px; margin-top:14px; }
.block { border:1px solid var(--line); border-radius:18px; padding:16px; background:rgba(255,255,255,.55); }
.block h2 { margin:0; font-size:18px; }
.blockhead { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; }
.mini { color:var(--muted); font-size:13px; }
.holes { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.hole { border:1px solid var(--line); border-radius:16px; padding:10px; background:rgba(3,7,18,.04); }
.hole .h { color:#2f6f2f; font-weight:700; margin-bottom:6px; }
.hole .v { font-size:20px; font-weight:800; }
.foot { color:var(--muted); font-size:12px; margin-top:14px; line-height:1.5; }
@media (max-width:1200px) { .hero { flex-direction:column; } .kpis,.stats,.grid { grid-template-columns:1fr 1fr; } }
@media (max-width:720px) { .kpis,.stats,.holes,.grid { grid-template-columns:1fr; } .input,select { min-width:100%; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="title">
      <h1>MWGC Ringer Dashboard</h1>
      <div class="pills" id="pills"></div>
    </div>
    <div class="upload">
      <label>Refresh by uploading a new workbook (.xlsx)</label>
      <input id="masterFile" type="file" accept=".xlsx" />
      <div class="mini" style="margin-top:10px;">The page reads the <strong>2026 Ringer Board</strong> tab and re-renders automatically.</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tabbtn active" data-tab="boardTab">Full Ringer Board</button>
    <button class="tabbtn" data-tab="profileTab">Player Profile</button>
  </div>

  <section id="boardTab" class="panel active">
    <div class="controls">
      <div class="left">
        <input class="input" id="boardSearch" placeholder="Search players..." />
        <select id="boardSort">
          <option value="ringer_asc">Sort: Ringer total (low to high)</option>
          <option value="ringer_desc">Sort: Ringer total (high to low)</option>
          <option value="name_asc">Sort: Player name (A-Z)</option>
        </select>
      </div>
    </div>
    <div class="kpis" id="boardKpis"></div>
    <div class="tablewrap"><table id="boardTable"></table></div>
  </section>

  <section id="profileTab" class="panel">
    <div class="controls">
      <div class="left">
        <input class="input" id="playerSearch" placeholder="Search/select player..." list="playerOptions" />
        <datalist id="playerOptions"></datalist>
        <select id="playerSelect"></select>
      </div>
      <div class="right mini" id="profileSummary"></div>
    </div>
    <div class="stats" id="profileKpis"></div>
    <div class="grid">
      <div class="block">
        <div class="blockhead"><h2>Hole-by-hole profile</h2><div class="mini">Best score and event counts by hole</div></div>
        <div class="holes" id="holeGrid"></div>
      </div>
      <div class="block">
        <div class="blockhead"><h2>Interactive charts</h2><div class="mini">Hover for detail</div></div>
        <div id="scoreChart" style="height:300px;"></div>
        <div id="eventChart" style="height:300px;margin-top:8px;"></div>
      </div>
    </div>
  </section>

  <div class="foot" id="footer"></div>
</div>

function renderPills() {

function renderBoard() {
  const q = document.getElementById('boardSearch').value.trim().toLowerCase();
  const sort = document.getElementById('boardSort').value;
  let rows = state.players.filter(p => !q || p.player_name.toLowerCase().includes(q));
  rows = sort === 'ringer_desc' ? [...rows].sort(byDesc) : sort === 'name_asc' ? [...rows].sort(byName) : [...rows].sort(byAsc);
  const avg = rows.length ? (rows.reduce((a,b) => a + (Number(b.ringer_total) || 0), 0) / rows.length).toFixed(1) : '—';
  const cards = [
    ['Players listed', rows.length],
    ['Lowest total', rows.length ? rows[0].ringer_total : '—'],
    ['Highest total', rows.length ? rows[rows.length - 1].ringer_total : '—'],
    ['Avg. total', avg],
    ['Selected player', currentPlayer || '—']
  ];
  document.getElementById('boardKpis').innerHTML = cards.map(([l,v]) => `<div class="card"><div class="label">${l}</div><div class="value">${fmt(v)}</div></div>`).join('');
  const cols = ['Player Name', ...Array.from({length:18}, (_,i) => `Hole ${i+1}`), 'Ringer Total', 'Birdies', 'Eagles', 'Chip Ins', 'Sand Saves'];
  let html = '<thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
  for (const p of rows) {
    html += `<tr><th data-player="${p.player_name}"><div class="namecell"><span>${p.player_name}</span></div></th>`;
    for (const h of p.holes) html += `<td><span class="score ${scoreClass(h.score)}">${fmt(h.score)}</span></td>`;
    html += `<td><strong>${fmt(p.ringer_total)}</strong></td><td>${fmt(p.birdies_total)}</td><td>${fmt(p.eagles_total)}</td><td>${fmt(p.chip_ins_total)}</td><td>${fmt(p.sand_saves_total)}</td></tr>`;

function renderSelectors() {
  const names = state.players.map(p => p.player_name);
  document.getElementById('playerOptions').innerHTML = names.map(n => `<option value="${n}"></option>`).join('');
  document.getElementById('playerSelect').innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
  if (currentPlayer && names.includes(currentPlayer)) {
    document.getElementById('playerSelect').value = currentPlayer;
    document.getElementById('playerSearch').value = currentPlayer;
  } else if (names.length) {
    currentPlayer = names[0];
    document.getElementById('playerSelect').value = currentPlayer;
    document.getElementById('playerSearch').value = currentPlayer;
  }
}

function selectPlayer(name) {
  if (!name) return;
  currentPlayer = name;
  document.getElementById('playerSelect').value = name;
  document.getElementById('playerSearch').value = name;
  renderProfile();
}

  document.getElementById('profileSummary').textContent = `Showing ${p.player_name} • ${p.holes_scored} holes scored • ${p.weeks_count} week(s) in source data`;

  const y = p.holes.map(h => (h.score === null || h.score === undefined) ? null : h.score);
  Plotly.newPlot('scoreChart', [{x, y, type:'scatter', mode:'lines+markers', line:{shape:'spline', width:3}, marker:{size:8}}], {margin:{l:40,r:10,t:20,b:35}, paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)', font:{color:'#173217'}, xaxis:{title:'Hole', gridcolor:'rgba(0,0,0,0.08)'}, yaxis:{title:'Best score', gridcolor:'rgba(0,0,0,0.08)', rangemode:'tozero'}, showlegend:false}, {displayModeBar:false, responsive:true});
  const totals = [p.holes.reduce((a,h)=>a+h.birdie,0), p.holes.reduce((a,h)=>a+h.eagle,0), p.holes.reduce((a,h)=>a+h.chip_in,0), p.holes.reduce((a,h)=>a+h.sand_save,0)];

function renderAll() { renderPills(); renderSelectors(); renderBoard(); renderProfile(); setStatus(`Loaded ${state.meta.source_master_file}. Use the upload control to swap in a refreshed workbook.`); }

function isoFromExcelSerial(serial) {
  const n = Number(serial);
  if (!Number.isFinite(n)) return null;
  const dt = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
  return dt.toISOString().slice(0, 10);
}

function extractValue(cell) {
  if (!cell) return null;
  if (cell.t === 'd' && cell.v instanceof Date) return cell.v.toISOString().slice(0,10);
  if (cell.t === 'n' && Number.isFinite(cell.v)) return cell.v;
  if (cell.v === undefined || cell.v === null) return null;
  return cell.v;
}


function parseWorkbook(buffer, fileName) {
  const wb = XLSX.read(buffer, { type:'array', cellDates:true });
  const sheetNames = wb.SheetNames || [];

  const getCell = (sheet, ref) => sheet ? sheet[ref] : null;
  const getText = (sheet, ref) => {
    const cell = getCell(sheet, ref);
    if (!cell) return null;
    if (cell.t === 'd' && cell.v instanceof Date) return cell.v.toISOString().slice(0,10);
    if (cell.t === 'n' && Number.isFinite(cell.v)) return cell.v;
    if (cell.v === undefined || cell.v === null || cell.v === '') return null;
    return cell.v;
  };
  const isoFromExcelSerial = (serial) => {
    const n = Number(serial);
    if (!Number.isFinite(n)) return null;
    const dt = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
    return dt.toISOString().slice(0, 10);
  };
  const selectedFromProfile = () => {
    const profileSheet = wb.Sheets['Player Profile'] || wb.Sheets[sheetNames.find(n => /player profile/i.test(n))];
    const v = getText(profileSheet, 'C4');
    return typeof v === 'string' ? v.trim() : '';
  };
  const lastUpdatedFromProfile = () => {
    const profileSheet = wb.Sheets['Player Profile'] || wb.Sheets[sheetNames.find(n => /player profile/i.test(n))];
    const v = getText(profileSheet, 'C1');
    if (typeof v === 'number') return isoFromExcelSerial(v);
    if (typeof v === 'string' && /^\d+(\.\d+)?$/.test(v)) return isoFromExcelSerial(v);
    if (v instanceof Date) return v.toISOString().slice(0,10);
    return typeof v === 'string' ? v : null;
  };

  const summaryName = sheetNames.find(n => n === '2026 Ringer Board' || /ringer board/i.test(n));
  const summarySheet = summaryName ? wb.Sheets[summaryName] : null;
  const summaryRows = summarySheet ? XLSX.utils.sheet_to_json(summarySheet, { defval:null, raw:true }) : [];
  const hasSummaryData = summaryRows.some(r => {
    const name = String(r['Player Name'] || r['Player name'] || r['PLAYER NAME'] || '').trim();
    const scoreCols = Array.from({length:18}, (_, i) => r[`Hole ${i+1}`]);
    const totals = [r['Ringer Total'], r['Birdies Total'], r['Eagles Total'], r['Chip Ins'], r['Sand Saves']];
    return Boolean(name) && (scoreCols.some(v => v !== null && v !== undefined && v !== '') || totals.some(v => Number(v) > 0));
  });

  const buildStateFromSummary = () => {
    const players = summaryRows.map((row) => {
      const name = String(row['Player Name'] || row['Player name'] || row['PLAYER NAME'] || '').trim();
      if (!name) return null;
      const holes = Array.from({length:18}, (_, i) => {
        const raw = row[`Hole ${i+1}`];
        const score = raw === null || raw === undefined || raw === '' ? null : Number(raw);
        return { hole: i+1, score: Number.isFinite(score) ? score : null, birdie: 0, eagle: 0, chip_in: 0, sand_save: 0 };
      });
      const toNum = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
      const ringer = toNum(row['Ringer Total']);
      const birdies = toNum(row['Birdies Total']);
      const eagles = toNum(row['Eagles Total']);
      const chipIns = toNum(row['Chip Ins']);
      const sandSaves = toNum(row['Sand Saves']);
      const holes_scored = holes.filter(h => h.score !== null).length;
      const total = Number.isFinite(ringer) && ringer !== 0 ? ringer : holes.reduce((a,h)=>a+(h.score || 0),0);
      return {
        gc_id:'',
        first_name: name.split(/\s+/)[0] || '',
        last_name: name.split(/\s+/).slice(1).join(' ') || '',
        player_name: name,
        holes,
        ringer_total: total,
        birdies_total: birdies,
        eagles_total: eagles,
        chip_ins_total: chipIns,
        sand_saves_total: sandSaves,
        holes_scored,
        weeks_count: 1,
      };
    }).filter(Boolean);
    players.sort((a,b) => a.ringer_total - b.ringer_total || a.player_name.localeCompare(b.player_name));
    return {
      meta: {
        source_master_file: fileName,
        dashboard_file: fileName,
        sheet_name: summaryName,
        last_updated: lastUpdatedFromProfile(),
        player_count: players.length,
        best_total: players.length ? players[0].ringer_total : null,
        average_total: players.length ? Math.round((players.reduce((a,b)=>a+b.ringer_total,0)/players.length) * 10) / 10 : null,
      },
      players,
      selected_player: selectedFromProfile() || (players[0] ? players[0].player_name : ''),
    };
  };

  const rawName = sheetNames.find(n => /hole[_ ]stats/i.test(n)) || sheetNames.find(n => /ringer raw/i.test(n)) || sheetNames.find(n => /raw/i.test(n));
  const rawSheet = rawName ? wb.Sheets[rawName] : null;
  const rawRows = rawSheet ? XLSX.utils.sheet_to_json(rawSheet, { defval:null, raw:true }) : [];
  const hasRawData = rawRows.some(r => {
    const name = String(r['Player Name'] || r['Player name'] || '').trim();
    const score = Number(r.Score);
    return Boolean(name) && ((Number.isFinite(score) && score > 0) || Number(r.Birdie) > 0 || Number(r.Eagle) > 0 || Number(r['Chip-in']) > 0 || Number(r['Sand Save']) > 0);
  });

  const buildStateFromRaw = () => {
    const stats = new Map();
    const ensure = (name, row) => {
      if (!stats.has(name)) stats.set(name, { weeks:new Set(), holes:Array.from({length:18}, (_,i)=>({hole:i+1, scores:[], birdie:0, eagle:0, chip_in:0, sand_save:0})), gc_id:String(row['GC Card Id'] || ''), first_name:String(row['First Name'] || ''), last_name:String(row['Last Name'] || '') });
      return stats.get(name);
    };
    for (const row of rawRows) {
      if (String(row.Include || '').toUpperCase() !== 'YES') continue;
      const name = String(row['Player Name'] || '').trim();
      const hole = Number(row.Hole);
      if (!name || !(hole >= 1 && hole <= 18)) continue;
      const s = ensure(name, row);
      const week = String(row.Week || '').trim();
      if (week) s.weeks.add(week);
      const score = Number(row.Score);
      if (Number.isFinite(score) && score > 0) s.holes[hole - 1].scores.push(score);
      for (const [k, src] of [['birdie','Birdie'], ['eagle','Eagle'], ['chip_in','Chip-in'], ['sand_save','Sand Save']]) {
        const val = Number(row[src] || 0);
        if (Number.isFinite(val)) s.holes[hole - 1][k] += val;
      }
    }
    const players = Array.from(stats.entries()).map(([name, s]) => {
      const holes = s.holes.map(h => ({ ...h, score: h.scores.length ? Math.min(...h.scores) : null }));
      return {
        gc_id: s.gc_id,
        first_name: s.first_name,
        last_name: s.last_name,
        player_name: name,
        holes,
        ringer_total: holes.reduce((a,h)=>a + (h.score || 0), 0),
        birdies_total: holes.reduce((a,h)=>a + h.birdie, 0),
        eagles_total: holes.reduce((a,h)=>a + h.eagle, 0),
        chip_ins_total: holes.reduce((a,h)=>a + h.chip_in, 0),
        sand_saves_total: holes.reduce((a,h)=>a + h.sand_save, 0),
        holes_scored: holes.filter(h => h.score !== null).length,
        weeks_count: s.weeks.size,
      };
    }).sort((a,b) => a.ringer_total - b.ringer_total || a.player_name.localeCompare(b.player_name));
    return {
      meta: {
        source_master_file: fileName,
        dashboard_file: fileName,
        sheet_name: rawName,
        last_updated: lastUpdatedFromProfile(),
        player_count: players.length,
        best_total: players.length ? players[0].ringer_total : null,
        average_total: players.length ? Math.round((players.reduce((a,b)=>a+b.ringer_total,0)/players.length) * 10) / 10 : null,
      },
      players,
      selected_player: selectedFromProfile() || (players[0] ? players[0].player_name : ''),
    };
  };

  if (hasSummaryData) return buildStateFromSummary();
  if (hasRawData) return buildStateFromRaw();

  throw new Error('No usable player data found in this workbook.');
}

async function loadWorkbook(file) {
  try {
    const buffer = await file.arrayBuffer();
    state = parseWorkbook(buffer, file.name);
    currentPlayer = state.selected_player || '';
    renderAll();
  } catch (err) {
    console.error(err);
    setStatus(`Could not load workbook: ${err.message || err}`);
  }
}
